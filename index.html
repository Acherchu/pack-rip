    + 'Will it be a Gem Mint 10?</p></div>'
    + (PSA.at_psa.length ? '<h2>At PSA</h2><div class="atpsa">' + PSA.at_psa.map(x => '<div class="sub1"><img src="' + esc(pic(x.card.s || "")) + '" alt="">'
        + '<div class="note">' + esc(x.card.n || "") + '</div><div class="cd" data-ready="' + x.ready + '"></div></div>').join("") + '</div>' : '')
    + (PSA.slabs.length ? '<h2>Your graded cards</h2><div class="slabs">' + PSA.slabs.map(x => '<div>' + slabHTML(x.card, x.grade, x.label,
        ' onclick="zoomCard(\'' + esc(x.card.id) + '\',0,0,\'\',' + x.grade + ')" style="cursor:zoom-in"') + '<div class="slabcap"><span>PSA ' + x.grade + '</span>'
        + slabPriceHTML(x.card, x.grade) + '</div></div>').join("") + '</div>' : '')
    + '<h2>Send a card</h2><p class="note">Tap a card to send it. It leaves your collection while it\'s at PSA.</p>'
    + (mine.length ? '<div class="cards sendgrid">' + mine.map(c => cardTile(c, {qty: ME.cards[c.id]})
        .replace('onclick="zoomCard(', 'onclick="psaSend(\'' + esc(c.id) + '\');return false;" data-z="zoomCard(')
        .replace('</button>', '<span class="sendb">Send · ' + PSA.cost + '</span></button>')).join("") + '</div>'
      : '<div class="empty">No cards to send yet. <a href="#open">Rip some packs!</a></div>')
    + '</div>';
  clearInterval(PSA_TIMER);
  PSA_TIMER = setInterval(tickPSA, 250);
  tickPSA();
}
function tickPSA(){
  const cds = document.querySelectorAll(".atpsa .cd");
  if(!cds.length || !$("main").querySelector(".psa")){ clearInterval(PSA_TIMER); return; }
  let due = false;
  cds.forEach(el => {
    const left = +el.dataset.ready - (Date.now() / 1000 - PSA_SKEW);
    if(left <= 0){ el.textContent = "Back!"; due = true; }
    else el.textContent = left >= 60 ? Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0") : Math.ceil(left) + "s";
  });
  if(due && !tickPSA.busy){
    tickPSA.busy = true;
    api("/psa").then(r => {
      PSA = r; PSA_SKEW = Date.now() / 1000 - r.now;
      if(r.back.length){ drawPSA(); psaReveal(r.slabs.filter(x => r.back.includes(x.sid))); }
    }).catch(() => {}).finally(() => { tickPSA.busy = false; });
  }
}
async function psaSend(cid){
  const c = cardIndex[cid];
  if(!c || !confirm("Send " + c.n + " to PSA for " + PSA.cost + " PokéBux?\nYou'll get it back graded in " + secsText(PSA.seconds) + ".")) return;
  try{
    const r = await api("/psa/send", {card: cid});
    PSA = r; PSA_SKEW = Date.now() / 1000 - r.now;
    ME.bux = r.bux; ME.cards[cid] = (ME.cards[cid] || 1) - 1; if(ME.cards[cid] <= 0) delete ME.cards[cid];

}
// one card at a time: the slab drops in, then the grade
function psaReveal(list){
  if(!list.length) return;
  const x = list[0], rest = list.slice(1);
  const box = document.createElement("div"); box.className = "psareveal";
  box.innerHTML = '<div class="box"><div class="note" style="color:#ffb3bf;margin-bottom:10px">Back from PSA</div>'
    + slabHTML(x.card, x.grade, x.label) + '<div class="gbig' + (x.grade === 10 ? " g10" : "") + '">PSA ' + x.grade + '</div>'
    + '<div class="note" style="margin-top:6px">' + esc(x.label) + (x.grade === 10 ? " — perfect!" : "")
    + ' · now worth ' + slabPriceHTML(x.card, x.grade) + ' <span class="note">(raw ' + money(x.card.p || 0) + ')</span> · tap to continue</div></div>';
  box.onclick = () => { box.remove(); psaReveal(rest); };
  document.body.appendChild(box);
  setTimeout(() => {
    if(x.grade === 10){ sfx("reveal", 7); sfx("godpack"); coinShower(); }
    else if(x.grade >= 9){ sfx("reveal", 5); }
    else sfx("ding");
  }, 500);
}

  $("mute").textContent = MUTED ? "🔇" : "🔊";
  SERVER = await findServer();
  // PSA grading isn't published yet: its tab only shows when the server has it switched on (a server
  // started with --psa answers /psa with 401 "sign in"; the live one answers 404). The page code can
  // be pushed safely - the auto-push hook publishes every change.
  const psaCheck = fetch(SERVER + "/psa", {cache: "no-store"}).then(r => { PSA_ON = r.status !== 404; }).catch(() => {});
  const tasks = [psaCheck, api("/sets").then(r => {
    SETS = r.sets.filter(s => s.pack);
    SETMAP = Object.fromEntries(r.sets.map(s => [s.id, s]));
  }).catch(() => {})];
  if(TOKEN) tasks.push(api("/me").then(me => { ME = me; dailyToast(me); }).catch(() => {}));
  await Promise.all(tasks);
  $("psatab").classList.toggle("hide", !PSA_ON);
  drawWho();
  route();
})();
</script>
</body>
</html>
