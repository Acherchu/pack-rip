<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack Rip</title>
<meta name="description" content="Open every Pokémon TCG pack ever made and build your collection online.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='14' y='4' width='36' height='56' rx='5' fill='%23ff3d5a'/><path d='M14 16 l6 -4 6 4 6 -4 6 4 6 -4 6 4' stroke='%23fff' stroke-width='3' fill='none'/><circle cx='32' cy='38' r='9' fill='%23fff'/></svg>">
<style>
:root{
  --bg:#0d0f1a; --bg2:#151829; --panel:#1b1f35; --panel2:#232845; --line:#2f3558;
  --text:#eef0ff; --dim:#9aa0c7; --faint:#646a94;
  --red:#ff3d5a; --gold:#ffc83d; --blue:#4da3ff; --pink:#ff5fd2; --green:#3ddc84;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#26204a 0%,var(--bg) 70%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
a{color:var(--blue)}
.hide{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(13,15,26,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:900;font-style:italic;font-size:26px;letter-spacing:-1px;text-decoration:none;color:var(--text);
  display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--red)}
.logo .mini{width:22px;height:30px;border-radius:4px;background:linear-gradient(160deg,#ff6b81,#c2185b);
  box-shadow:0 0 0 2px #fff3 inset;transform:rotate(-8deg)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--dim);font-weight:600;font-size:15px}
nav a.on{background:var(--panel2);color:var(--text)}
nav a:hover{color:var(--text)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--red)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.btn:hover{border-color:var(--dim)}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.btn.main:hover{filter:brightness(1.1)}
.btn.small{padding:5px 12px;font-size:14px}
.iconbtn{background:none;border:0;font-size:20px;padding:4px 6px;color:var(--dim)}

main{max-width:1200px;margin:auto;padding:18px 16px 60px}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:20px;margin:26px 0 10px}
.sub{color:var(--dim);margin:0 0 16px}
.banner{background:#3a1622;border:1px solid #7a2a3d;color:#ffd1da;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.note{color:var(--dim);font-size:14px}
.empty{color:var(--dim);text-align:center;padding:50px 10px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;
  animation:spin .8s linear infinite;margin:50px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- pack shelf: one big pack at a time, scroll sideways ---------- */
.packtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.packtop h1{margin:0}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;color:var(--text);outline:none}
.search:focus{border-color:var(--dim)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 0;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.shelf{--pw:clamp(230px,min(27vw,36vh),330px);position:relative;margin:0 -16px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;perspective:1400px;
  padding:34px calc(50% - var(--pw) / 2) 26px}
.track::-webkit-scrollbar{display:none}
.track.dragging{scroll-snap-type:none;cursor:grabbing}
.slot{flex:none;width:var(--pw);scroll-snap-align:center;background:none;border:0;padding:0 12px;position:relative}
.slot .pack{transition:transform .12s ease-out,filter .12s;will-change:transform}
.slot.on .pack{box-shadow:0 26px 60px #000c,0 0 50px hsl(var(--h) 90% 60% / .35),inset 0 0 0 1px #ffffff50}
.slot.on:hover .pack{animation:hover 1.6s ease-in-out infinite}
@keyframes hover{50%{translate:0 -8px}}
.arrow{position:absolute;top:50%;translate:0 -50%;z-index:15;width:48px;height:48px;border-radius:50%;
  background:#0d0f1acc;border:1px solid var(--line);font-size:30px;line-height:1;display:grid;place-items:center;padding:0 0 4px}
.arrow:hover{border-color:var(--dim)}
.arrow.l{left:max(12px,calc(50% - var(--pw) * 1.7))}
.arrow.r{right:max(12px,calc(50% - var(--pw) * 1.7))}
.pinfo{text-align:center;min-height:150px}
.ppack{margin-top:8px;font-size:16px;color:var(--dim)}
.ppack b{color:var(--green);font-size:20px}
.pl{font-weight:800;font-size:17px;margin:2px 0 6px}
.pl.up{color:var(--green)}
.pl.down{color:#ff8a9c}
.pname{font-size:26px;font-weight:900;letter-spacing:-.5px}
.btn.rip{margin-top:14px;background:linear-gradient(135deg,#ff3d5a,#ff8a3d);border:0;color:#fff;font-size:20px;
  font-weight:900;font-style:italic;letter-spacing:1px;padding:14px 46px;box-shadow:0 8px 30px #ff3d5a66;animation:ripglow 1.8s ease-in-out infinite}
.btn.rip:hover{filter:brightness(1.12)}
@keyframes ripglow{50%{box-shadow:0 8px 44px #ff3d5aaa;transform:scale(1.04)}}

/* a booster pack, drawn in CSS: crimped foil ends, set logo, holo foil that moves */
.pack{--h:220;position:relative;width:100%;aspect-ratio:5/8.4;border-radius:7px;overflow:hidden;
  background:linear-gradient(160deg,hsl(var(--h) 88% 66%),hsl(var(--h) 74% 44%) 40%,hsl(calc(var(--h) + 35) 80% 26%));
  box-shadow:0 18px 40px #000a,inset 0 0 0 1px #ffffff40}
.pack::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,transparent 60%);background-size:250% 100%;
  animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
.pack .pfoil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35;
  background:linear-gradient(125deg,#ff4fd8,#4ff0ff 25%,#fff36b 50%,#ff4fd8 75%,#4ff0ff);background-size:300% 300%;
  background-position:var(--gx,50%) var(--gy,50%)}
.pack .glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--gx,35%) var(--gy,20%),#fffc,transparent 50%)}
.pack .crimp{position:absolute;left:0;right:0;height:7%;z-index:2;
  background:repeating-linear-gradient(90deg,#ffffff45 0 3px,#00000030 3px 6px),hsl(var(--h) 55% 28%)}
.pack .crimp.t{top:0}.pack .crimp.b{bottom:0}
.pack .lg{position:absolute;left:8%;width:84%;top:15%;height:30%;object-fit:contain;filter:drop-shadow(0 4px 8px #000a)}
.pack .ball{position:absolute;left:50%;top:30%;width:84%;aspect-ratio:1;translate:-50% 0;border-radius:50%;opacity:.13;
  border:7px solid #fff;pointer-events:none}
.pack .ball::before{content:"";position:absolute;left:-7px;right:-7px;top:50%;height:7px;translate:0 -50%;background:#fff}
.pack .ball::after{content:"";position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  border:7px solid #fff;background:hsl(var(--h) 74% 44%)}
.pack .band{position:absolute;left:0;right:0;bottom:12%;padding:8px 8%;background:#0006;display:flex;flex-direction:column;
  align-items:center;gap:2px;text-align:center}
.pack .band b{font-size:14px;line-height:1.15;text-shadow:0 2px 4px #000}
.pack .band span{font-size:9px;letter-spacing:2px;font-weight:800;opacity:.8}
.pack .sn{position:absolute;left:6%;right:6%;top:24%;font-weight:900;font-size:20px;text-align:center;text-shadow:0 2px 4px #000a;line-height:1.1}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;background:none;border:0;padding:0;text-align:left;min-width:0;width:100%;display:block}
.card img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:5%/3.6%;display:block;background:var(--panel)}
.card.miss img{filter:grayscale(1) brightness(.45);opacity:.5}
.card .cap{font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.card .cap span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.price{color:var(--green);font-weight:700;white-space:nowrap}
.price.est{color:var(--gold)}
.qty{position:absolute;top:6px;right:6px;background:#000c;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
.newb{position:absolute;top:6px;right:6px;background:var(--gold);color:#221;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:900}
.t4 img{box-shadow:0 0 0 2px var(--blue),0 0 14px #4da3ff88}
.t5 img{box-shadow:0 0 0 2px var(--gold),0 0 16px #ffc83d99}
.t6 img{box-shadow:0 0 0 2px var(--pink),0 0 18px #ff5fd2aa}
.t7 img{box-shadow:0 0 0 3px #fff,0 0 22px #b388ff,0 0 40px #4dd0e1aa}
/* ---------- PokeBux ---------- */
.buxchip{display:inline-flex;align-items:center;gap:6px;background:#2a2410;border:1px solid #6b5a1a;color:#ffd24d;
  border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;white-space:nowrap;text-decoration:none}
.coin{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;flex:none;vertical-align:-3px;
  background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc83d 45%,#b8860b);box-shadow:inset 0 0 0 2px #a07400;
  font-size:10px;font-weight:900;color:#7a5500;font-style:normal;line-height:1}
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:70;background:#1b1f35;border:1px solid #6b5a1a;color:var(--text);
  padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px #000a;max-width:min(520px,92vw);text-align:center;
  animation:toast 3.6s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- earning ---------- */
.earners{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:620px;margin:10px auto 0}
.earner{text-align:center;position:relative}
.earner img{width:100%;aspect-ratio:63/88;border-radius:5%/3.6%;display:block;box-shadow:0 12px 30px #000a;animation:earnbob 3s ease-in-out infinite}
.earner:nth-child(2) img{animation-delay:-1s}.earner:nth-child(3) img{animation-delay:-2s}
@keyframes earnbob{50%{transform:translateY(-6px)}}
.earner .en{font-weight:800;margin-top:8px;font-size:14px}
.earner .ev{color:var(--dim);font-size:13px}
.earner .er{color:#ffd24d;font-weight:800;font-size:13px}
.earner .medal{position:absolute;top:-10px;left:50%;translate:-50% 0;background:var(--gold);color:#221;border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px;z-index:1}
.earnbox{max-width:620px;margin:26px auto 0;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.ecount{font-size:clamp(40px,10vw,70px);font-weight:900;color:#ffd24d;font-variant-numeric:tabular-nums;line-height:1.05;
  text-shadow:0 0 30px #ffc83d55}
.ecount .coin{width:.8em;height:.8em;font-size:.45em;vertical-align:.05em;margin-right:.15em}
.erate{color:var(--dim);margin:6px 0 16px;font-weight:600}
.ebar{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff15}
.ebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb23d,#ffe14d);transition:width .3s linear}
.ebar.full i{background:linear-gradient(90deg,#ff3d5a,#ff8a3d);animation:fullpulse 1s ease-in-out infinite alternate}
@keyframes fullpulse{to{filter:brightness(1.4)}}
.efull{margin:8px 0 16px;font-weight:700;color:var(--dim)}
.efull.full{color:#ff8a9c}
.btn.claim{background:linear-gradient(135deg,#ffc83d,#ff9a3d);border:0;color:#221;font-size:20px;font-weight:900;padding:13px 40px;box-shadow:0 8px 30px #ffc83d55}
.btn.claim:disabled{opacity:.45;box-shadow:none}
.btn.claim.ready{animation:ripglow 1.6s ease-in-out infinite}
.coinfall{position:fixed;z-index:80;pointer-events:none;top:-24px}
@media (max-width:560px){ .earners{gap:10px} .earner .en{font-size:12px} }

/* ---------- wheels ---------- */
.wheels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;margin-top:10px}
.wsec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px 22px;text-align:center}
.wsec h2{margin:0 0 4px}
.wone{max-width:560px;margin:10px auto 0}
.wwrap{position:relative;width:min(460px,100%);aspect-ratio:1;margin:14px auto 0}
.wwrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 14px 40px #000a,0 0 0 6px #1b1f35,0 0 0 9px #ffd24d55}
.wptr{position:absolute;left:50%;top:-6px;translate:-50% 0;width:0;height:0;z-index:2;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #ffd24d;filter:drop-shadow(0 3px 3px #000a)}
.whub{position:absolute;left:50%;top:50%;translate:-50% -50%;width:17%;aspect-ratio:1;border-radius:50%;z-index:2;border:4px solid #111;
  background:linear-gradient(#e53935 0 46%,#111 46% 54%,#fff 54%);box-shadow:0 4px 12px #000a}
.whub::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#fff;border:3px solid #111}
.wnow{min-height:30px;margin-top:12px;font-weight:900;font-size:20px;color:#ffe14d}
.btn.wspin{margin-top:12px;background:linear-gradient(135deg,#8a5cff,#ff5fd2);border:0;color:#fff;font-size:19px;font-weight:900;padding:12px 38px;box-shadow:0 8px 26px #8a5cff55}
.btn.wspin:disabled{opacity:.45;box-shadow:none}
.wres{margin-top:16px;min-height:10px}
.wres .pop{animation:wpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes wpop{from{opacity:0;transform:scale(.4)}}
.wres img{width:min(220px,60%);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 10px 20px #000a)}
.wres .wn{font-size:28px;font-weight:900}
.wres .wno{color:var(--dim);font-weight:700}
.wpacks{margin-top:22px;text-align:left}
.wpacks h3{margin:0 0 4px;font-size:19px}
.wprow{display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.wpk{flex:none;width:62px;aspect-ratio:553/1000;border-radius:3px;background:#15182a center/100% 100% no-repeat;box-shadow:0 6px 14px #0008}
.wpk.logo{background-size:90% auto;background-color:#232845}
.wpinfo{flex:none;width:140px;font-size:13px;color:var(--dim)}
.wpinfo b{display:block;color:var(--text);font-size:15px;line-height:1.2;margin-bottom:2px}
.wpinfo .btn{margin-top:8px;padding:5px 12px;font-size:13px}
.wpcards{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.wpcards button{flex:none;background:none;border:0;padding:0;width:88px;text-align:center}
.wpcards img{width:88px;aspect-ratio:63/88;border-radius:5%/3.6%;display:block;box-shadow:0 4px 10px #0008}
.wpcards span{font-size:11px;color:var(--dim);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ .wprow{flex-wrap:wrap} .wpinfo{width:auto;flex:1} .wpcards{flex-basis:100%} }
.wres .wbig{font-size:72px;font-weight:900;line-height:1;background:linear-gradient(90deg,#ffd24d,#fff6c2,#ffc83d);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0008)}

/* ---------- PSA grading (red) ---------- */
nav a.psatab{color:#ff6b7d}
nav a.psatab.on{background:#c8102e;color:#fff}
.psahead{background:linear-gradient(135deg,#6e0616,#c8102e 60%,#e2334d);border-radius:18px;padding:18px 20px;color:#fff;
  box-shadow:0 10px 30px #c8102e44;margin-bottom:6px}
.psahead h1{margin:0}
.psahead .psalogo{display:inline-block;background:#fff;color:#c8102e;font-weight:900;font-style:italic;border-radius:6px;padding:2px 10px;
  margin-right:10px;font-size:26px;vertical-align:3px}
.psahead p{margin:6px 0 0;color:#ffe3e7}
.psa h2{color:#ff8a9c}
.slabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.slab{position:relative;background:linear-gradient(160deg,#f4f6fb,#cdd4e2);border-radius:10px;padding:7px 7px 9px;
  box-shadow:0 10px 26px #000b,inset 0 0 0 2px #ffffffaa;text-align:left;border:0;width:100%}
.slab .lab{background:#fff;border:3px solid #c8102e;border-radius:4px;padding:4px 6px;display:grid;grid-template-columns:1fr auto;
  gap:4px;align-items:center;color:#111;font-size:9px;line-height:1.2;margin-bottom:7px;min-height:44px}
.slab .ln{min-width:0}
.slab .ln b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .psa{color:#c8102e;font-weight:900;font-style:italic;font-size:11px}
.slab .lg{text-align:right;font-weight:900;font-size:9px;white-space:nowrap}
.slab .gn{display:block;font-size:24px;line-height:1;color:#111}
.slab img{width:100%;aspect-ratio:63/88;border-radius:4%/3%;display:block;box-shadow:0 2px 6px #0004}
.slab.g10{box-shadow:0 0 0 3px #ffd24d,0 0 26px #ffd24d99,0 10px 26px #000b}
.psabadge{position:absolute;left:6px;top:6px;background:#c8102e;color:#fff;font-weight:900;font-size:12px;border-radius:6px;
  padding:2px 7px;box-shadow:0 2px 6px #0008}
.slabcap{font-size:12px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between}
.atpsa{display:flex;gap:12px;flex-wrap:wrap}
.atpsa .sub1{width:130px;text-align:center;background:var(--panel);border:1px solid #7a2a3d;border-radius:12px;padding:8px}
.atpsa img{width:100%;aspect-ratio:63/88;border-radius:5%/3.6%;display:block;filter:grayscale(.6) brightness(.7)}
.atpsa .cd{font-weight:900;color:#ff8a9c;margin-top:6px;font-variant-numeric:tabular-nums}
.sendgrid .card{cursor:pointer}
.sendgrid .card .sendb{position:absolute;left:50%;top:38%;translate:-50% 0;background:#c8102e;color:#fff;font-weight:900;
  border-radius:999px;padding:6px 12px;font-size:13px;opacity:0;transition:opacity .15s;white-space:nowrap}
.sendgrid .card:hover .sendb{opacity:1}
.psareveal{position:fixed;inset:0;z-index:60;background:#000c;display:grid;place-items:center;animation:stagein .3s}
.psareveal .box{text-align:center;width:min(260px,66vw)}
.psareveal .slab{animation:slabin .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes slabin{from{opacity:0;transform:translateY(60px) rotate(-8deg) scale(.7)}}
.psareveal .gbig{font-size:clamp(40px,12vw,76px);font-weight:900;color:#fff;margin-top:14px;animation:wpop .6s .5s both cubic-bezier(.2,1.4,.4,1)}
.psareveal .gbig.g10{background:linear-gradient(90deg,#ffd24d,#fff6c2,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- collection ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .v{font-size:26px;font-weight:900}
.stat .k{color:var(--dim);font-size:13px}
.setrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 14px;text-align:left}
.setrow:hover{border-color:var(--dim)}
.setrow img{width:70px;height:36px;object-fit:contain}
.setrow .info{flex:1;min-width:0}
.setrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:7px;background:var(--bg2);border-radius:99px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px}
.back{background:none;border:0;color:var(--dim);padding:0;margin-bottom:8px;font-weight:600}
.back:hover{color:var(--text)}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.head .lgbig{height:60px;max-width:200px;object-fit:contain}

/* ---------- friends / feed ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left}
.person:hover{border-color:var(--dim)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.person .info{flex:1;min-width:0}
.person .nm{font-weight:800}
.feed > div{min-width:0;display:flex;flex-direction:column}
.feed .who{display:block;margin-left:0;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.feed .who a{color:var(--text);font-weight:700;text-decoration:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:#000b;display:flex;overflow:auto;padding:20px}
.sheet{margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(380px,100%)}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
.sheet input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}
.sheet input:focus{border-color:var(--dim)}
.err{color:#ff8a9c;font-size:14px;min-height:20px;margin-top:10px}
.zoom{margin:auto;text-align:center;max-width:420px;width:100%}
.zoom img{width:100%;border-radius:4.5%/3.2%;box-shadow:0 20px 60px #000}
.zoom .meta{margin-top:12px;color:var(--dim)}
.zoom .meta b{color:var(--text);font-size:18px}

/* ---------- the opening stage (full screen, made to be recorded) ---------- */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#2b2257,#0b0a18 62%,#040409);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none}
#stage .blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.33;pointer-events:none}
#stage .b1{background:#5b2bff;left:-22vmax;top:-26vmax;animation:drift 14s ease-in-out infinite alternate}
#stage .b2{background:#ff2b7a;right:-26vmax;bottom:-32vmax;animation:drift 17s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,10vmax) scale(1.15)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#stage .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:8}
#stage .top .ttl{font-weight:800;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage .hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  color:var(--dim);font-weight:700;z-index:8;padding:0 16px}
#stage .hint .btn{margin:6px}
.swipe{display:inline-block;margin-right:10px;font-size:22px;animation:swipe 1.3s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-16px) rotate(-10deg)}50%{transform:translateX(16px) rotate(10deg)}}
.arena{position:relative;width:min(380px,78vw,calc(62vh * .716));aspect-ratio:63/88;--rx:0deg;--ry:0deg;--gx:50%;--gy:30%}
#stage.quake .arena{animation:quake .55s}
@keyframes quake{10%{transform:translate(-11px,6px) rotate(-1.2deg)}20%{transform:translate(10px,-8px) rotate(1deg)}
  30%{transform:translate(-8px,-5px)}42%{transform:translate(7px,7px)}56%{transform:translate(-4px,3px)}72%{transform:translate(3px,-2px)}}

/* the pack on the stage: tilts toward you, tears along the top */
.arena .pack{position:absolute;left:-2%;width:104%;top:50%;translate:0 -50%;z-index:2;border-radius:10px;
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s,box-shadow .4s}
/* the torn strip has to be able to leave the pack - .pack clips everything else (shelf) */
.arena .pack{overflow:visible}
.arena .pack .glare{border-radius:inherit}
.arena .pack .band b{font-size:19px}
.arena .pack .band span{font-size:11px}
/* the chosen pack's entrance (packIntro): it flies in spinning, lands with a burst, then floats */
#stage.enter{animation:stagein .35s ease-out}
@keyframes stagein{from{opacity:0}}
.arena .pack.idle{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 calc(-50% - 10px)}}
.ring{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:4;
  border:3px solid var(--rc,#fff);box-shadow:0 0 30px var(--rc,#fff),inset 0 0 30px var(--rc,#fff);animation:ring .9s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(3.2);opacity:0}}
#stage .hint.later{animation:hintin .5s .9s both}
@keyframes hintin{from{opacity:0;transform:translateY(10px)}}
/* the real pack photo (packArt) */
.pack.real{aspect-ratio:553/1000;border-radius:4px;background-color:#15182a;background-size:100% 100%;background-repeat:no-repeat;
  background-position:center}
.pack.real .crimp{display:none}
.pack.real .glare{opacity:.6}
.pack.real .flap{box-shadow:0 2px 4px #0005}
.arena .pack.real{left:-2%;width:104%}  /* wider than the cards, so they fit inside it at almost full size */
.pack .flap{position:absolute;left:0;right:0;top:0;height:11%;z-index:3;background:inherit;background-size:100% 909%;
  background-position:top;transform-origin:100% 100%;box-shadow:0 2px 6px #0006}
.pack .flap .crimp{height:64%}
/* On the stage the pack is two pieces: the strip (.flap) and the body (.pbody, everything under the
   tear line). splitPack moves the picture off the pack itself onto both, so when the strip lifts or
   flies off there's nothing behind it but the background (the pack's own picture used to show
   there, so the top looked doubled). */
.pack .pbody{position:absolute;left:0;right:0;top:11%;bottom:0;z-index:0;border-radius:inherit;border-top-left-radius:0;
  border-top-right-radius:0;background-size:100% 112.36%;background-position:bottom;background-repeat:no-repeat;
  box-shadow:0 18px 40px #000a,inset 0 0 0 1px #ffffff40}
.arena .pack.split{background:none;box-shadow:none}
.arena .pack.split::before,.arena .pack.split .glare,.arena .pack.split .pfoil{top:11%}
.pack .cut{position:absolute;left:0;right:0;top:11%;height:4px;z-index:4;translate:0 -50%;transition:opacity .3s}
.pack .cut::before{content:"";position:absolute;left:3%;right:3%;top:1px;border-top:2px dashed #ffffffb0;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.pack .cut i{position:absolute;left:0;top:0;height:100%;width:calc(var(--p,0) * 100%);background:#fff;border-radius:3px;
  box-shadow:0 0 8px #fff,0 0 18px #ffd84d,0 0 34px #ff9a3d}
/* the torn strip stays solid while it flies up and away (it used to fade out almost at once) */
.pack.torn .flap{animation:flapoff .8s cubic-bezier(.25,.6,.45,1) forwards}
@keyframes flapoff{30%{transform:translate(6%,-150%) rotate(-12deg);opacity:1}75%{opacity:1}
  100%{transform:translate(60%,-700%) rotate(40deg);opacity:0}}
.pack.torn .cut{opacity:0}
.pack.glowing{box-shadow:0 -20px 70px 6px #ffe08acc,0 18px 40px #000a;animation:packbuzz .18s linear infinite}
@keyframes packbuzz{50%{translate:1px calc(-50% - 1px)}}
.pack.away,.arena .pack.away{animation:packaway .75s .1s ease-in forwards}
@keyframes packaway{to{transform:translateY(125%) rotate(7deg);opacity:0}}
.light{position:absolute;left:10%;right:10%;top:7%;height:40px;border-radius:50%;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse,#fff 0,#ffe08a 35%,transparent 70%);filter:blur(3px)}
.light.on{animation:light 1.3s ease-out forwards}
@keyframes light{0%{opacity:0;transform:scale(.4,.3)}18%{opacity:1;transform:scale(1.3,2.5)}100%{opacity:0;transform:scale(1.6,7) translateY(-10%)}}

/* the cards: a stack that comes up out of the pack; swipe the top one away */
.deck{position:absolute;inset:0;z-index:1}
.dtilt{position:absolute;inset:0;transform-style:flat;transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .35s ease-out}
.deck.rise{animation:deckrise 1.15s cubic-bezier(.3,1.15,.4,1) forwards}
@keyframes deckrise{0%{transform:translateY(22%) scale(.86)}45%{transform:translateY(-34%) scale(.95)}100%{transform:none}}
.deck.up{z-index:3}
/* the card back: dark blue border, blue vortex, tilted Poke Ball, yellow "Pokemon" word (an SVG
   drawn for this site - see cardback.py notes in CLAUDE.md) */

.deck .back{position:absolute;inset:0;margin:0;transform:translate(calc(var(--k) * 3px),calc(var(--k) * 6px)) rotate(calc(var(--k) * 1.3deg));box-shadow:0 12px 30px #000a}
.deck .under{border-radius:4.5%/3.2%;overflow:hidden}
.deck .under img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.big{position:absolute;inset:0;perspective:1100px;z-index:3;cursor:grab;touch-action:none}  /* its own 3D space: a flipping card can't swing into the cards under it (.dtilt is flat) */
.big.held{cursor:grabbing}
.big.in{animation:cardin .3s ease-out}
@keyframes cardin{from{transform:translate(3px,6px) rotate(1.3deg)}}
.big .shk,.big .tilt,.big .inner{position:absolute;inset:0;transform-style:preserve-3d}
.big .inner{transition:none}
.big.down .inner{transform:rotateY(180deg)}
.big.down .shk{animation:tremble .11s linear infinite}
@keyframes tremble{25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
.big .face,.big .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%/3.2%;overflow:hidden;box-shadow:0 20px 50px #000b}
.big .face img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.big .bk{position:absolute;transform:rotateY(180deg)}
.big.down .bk{animation:aura .7s ease-in-out infinite alternate}
@keyframes aura{from{box-shadow:0 0 18px 3px var(--rc)}to{box-shadow:0 0 70px 22px var(--rc)}}
.big.hit:not(.down) .face{box-shadow:0 0 40px 10px var(--rc),0 20px 50px #000b}
.big.g7:not(.down) .face{animation:rainbow 1.6s linear infinite}
@keyframes rainbow{0%,100%{box-shadow:0 0 60px 14px #ff5f5f}25%{box-shadow:0 0 60px 14px #ffd24d}50%{box-shadow:0 0 60px 14px #5fffb0}75%{box-shadow:0 0 60px 14px #7f9fff}}
.rays{position:absolute;left:50%;top:50%;width:270%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg,var(--rc,#fff) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);
  opacity:0;transition:opacity .5s,scale .7s;animation:spin 20s linear infinite}
.rays.on{opacity:.22}
.rays.boom{opacity:.75;scale:1.25}
.rays.g7{animation:spin 20s linear infinite,hue 2.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.tag{position:absolute;left:50%;bottom:calc(100% + 12px);translate:-50% 0;display:flex;gap:6px;white-space:nowrap;z-index:5;transition:opacity .25s,transform .3s}
.tag.off{opacity:0;transform:translateY(8px)}
.tag span{background:#000b;border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px}
.tag .n{background:var(--gold);color:#221}
.count{position:absolute;top:calc(100% + 16px);left:0;right:0;text-align:center;color:var(--dim);font-weight:700;font-size:14px}
.rname{position:absolute;top:12%;left:0;right:0;text-align:center;font-weight:900;font-style:italic;letter-spacing:1px;
  font-size:clamp(26px,6vw,56px);color:#fff;opacity:0;z-index:7;pointer-events:none;padding:0 12px;
  text-shadow:0 0 24px var(--rc),0 0 50px var(--rc),0 5px 0 #0009}
.rname.pop{animation:rpop 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
.rname.godpack{font-size:clamp(40px,11vw,96px);top:30%;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 4px #000) drop-shadow(0 6px 0 #000c) drop-shadow(0 0 26px #c58bff) !important;animation:rgod 3.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rgod{0%{opacity:0;transform:scale(.2) rotate(-12deg)}10%{opacity:1;transform:scale(1.3) rotate(-4deg)}20%{transform:scale(1) rotate(-4deg)}
  35%{transform:scale(1.08) rotate(-4deg)}50%{transform:scale(1) rotate(-4deg)}85%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-4deg) translateY(-20px)}}
.godtag{font-weight:900;font-style:italic;font-size:26px;letter-spacing:1px;margin-bottom:4px;
  background:linear-gradient(90deg,#ff5f5f,#ffd24d,#5fffb0,#5fc8ff,#c58bff,#ff5f5f);-webkit-background-clip:text;background-clip:text;color:transparent}
.rname.g7{background:linear-gradient(90deg,#ff5f5f,#ffd24d,#5fffb0,#5fc8ff,#c58bff,#ff5f5f);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px #c58bff) drop-shadow(0 4px 0 #0009)}
@keyframes rpop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}12%{opacity:1;transform:scale(1.18) rotate(-3deg)}22%{transform:scale(1) rotate(-3deg)}
  80%{opacity:1;transform:scale(1.02) rotate(-3deg)}100%{opacity:0;transform:scale(1.02) rotate(-3deg) translateY(-14px)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#fff0 75%);pointer-events:none;animation:flash .8s forwards;z-index:7}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.summary{position:relative;z-index:5;width:min(900px,94vw);max-height:76vh;overflow:auto;text-align:center;padding:40px 4px 10px;touch-action:pan-y}
.summary .cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.summary .card{animation:deal .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes deal{from{opacity:0;transform:translateY(80px) rotate(-10deg) scale(.6)}}
.summary .tot{font-size:40px;font-weight:900;margin:4px 0 14px}
.summary .tot small{display:block;font-size:14px;color:var(--dim);font-weight:600}
@media (max-width:560px){
  .bar{gap:8px 10px;padding:8px 16px}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav a{white-space:nowrap;padding:7px 11px;font-size:14px}

  .pname{font-size:22px}

<script>
/* =================================================================================
   PACK RIP - open every Pokémon pack and keep what you pull.
   The server (PackRipServer/server.py, on Archer's PC behind a Cloudflare tunnel) opens
   the packs and saves collections, so they follow you to any device and friends can see them.
   ================================================================================= */
let SERVER = null, ONLINE = false;
let SETS = [], SETMAP = {};
const SETCARDS = {};           // set id -> cards (from the server's cache)
let ME = null;                 // signed-in player: {name, packs, cards:{id:n}, friends, recent, best}
let TOKEN = store("prToken");
let MUTED = store("prMute") === "1";
let packFilter = {q: "", series: ""};

function store(k, v){
  try{ if(v === undefined) return localStorage.getItem(k);
       if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){}
  return null;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => v == null ? "—" : "$" + (v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(2));
// A price for show. Estimates (the server marks them with "e") get a "~" and gold, never green.
const priceHTML = c => c.p == null ? '<span class="price">—</span>'
  : '<span class="price' + (c.e ? ' est" title="Estimated price' : '') + '">' + (c.e ? "~" : "") + money(c.p) + '</span>';
const EST_WHY = {
  set: "Estimated from TCGplayer market prices of other {r} cards in this set — TCGplayer has no market price for this one yet.",
  rarity: "Estimated from what {r} cards from recent sets sell for on TCGplayer — no TCGplayer market price for this one yet.",
  grade: "Estimated from the grade: TCGplayer doesn't list graded prices, so it's the raw card's price times what that PSA grade usually sells for.",
  tier: "Estimated from TCGplayer market prices of cards just as rare as a {r} in recent sets — no TCGplayer market price for this one yet.",
  any: "A rough estimate from a typical TCGplayer market price — no TCGplayer market price for this one yet."
};
const FOIL_NAME = {pokeball: "Poké Ball reverse holo", masterball: "Master Ball reverse holo"};
const rhName = c => c.rh ? " · " + (FOIL_NAME[c.rv] || "reverse holo") : "";
// Bonus mini-sets that were never sold as packs of their own - their cards come in the main set's
// packs, so the collection and binders file them under that set (server: SUBSET_OF).
const PARENT = {me55c: "me55", cel25c: "cel25", swsh9tg: "swsh9", swsh10tg: "swsh10", swsh11tg: "swsh11",
  swsh12tg: "swsh12", swsh12pt5gg: "swsh12pt5", swsh45sv: "swsh45", sma: "sm115"};
const BONUS = Object.fromEntries(Object.entries(PARENT).map(([k, v]) => [v, k]));
const packSetOf = id => PARENT[setOf(id)] || setOf(id);
const setOf = id => id.slice(0, id.lastIndexOf("-"));
const hueOf = s => { let h = 7; for(const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return Math.round((h % 1000) * 137.5) % 360; };
function ago(t){
  const s = Date.now()/1000 - t;
  if(s < 60) return "just now";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

/* ---------------- finding and talking to the server ---------------- */
async function findServer(){
  const param = new URLSearchParams(location.search).get("server");
  if(param) return param.replace(/\/$/, "");
  // On GitHub Pages: read server.json through the GitHub API - it's never stale, unlike the
  // Pages copy, and the tunnel address changes every time Archer's PC restarts.
  if(location.hostname.endsWith("github.io")){
    const owner = location.hostname.split(".")[0], repo = location.pathname.split("/")[1];
    try{
      const r = await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/server.json", {cache:"no-store"});
      if(r.ok){ const j = await r.json(); return JSON.parse(atob(j.content.replace(/\s/g,""))).url.replace(/\/$/, ""); }
    }catch(e){}
    try{
      const r = await fetch("server.json?t=" + Date.now(), {cache:"no-store"});
      if(r.ok) return (await r.json()).url.replace(/\/$/, "");
    }catch(e){}
  }
  return "http://127.0.0.1:24710";
}

async function api(path, body){
  const opts = {method: body ? "POST" : "GET", headers: {}};
  if(body){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  if(TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  let r;
  try{ r = await fetch(SERVER + path, opts); }
  catch(e){ setOnline(false); throw new Error("The Pack Rip servers can't be reached right now. Try again in a bit!"); }
  setOnline(true);
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(r.status === 401 && path !== "/login" && path !== "/signup"){ signedOut(); }
  if(!r.ok) throw new Error(j.error || "Something went wrong (" + r.status + ").");
  return j;
}

async function setCards(id){

const cardIndex = {};
async function loadSetsFor(ids){
  const need = [...new Set(ids.map(setOf))].filter(s => SETMAP[s]);
  // a few at a time - the server answers from its cache, but no need to flood it
  for(let i = 0; i < need.length; i += 6){
    await Promise.all(need.slice(i, i+6).map(s => setCards(s).then(cs => cs.forEach(c => cardIndex[c.id] = c)).catch(() => {})));
  }
}

let shelfList = [], shelfIdx = -1, shelfRaf = 0, shelfWheel = 0, shelfAim = {i: -1, t: 0};
function showPacks(){

function drawPacks(){

function shelfTo(i, instant){
  const tr = $("track"), el = tr && tr.children[i];
  if(!el) return;

  tr.scrollTo({left: el.offsetLeft + el.offsetWidth / 2 - tr.clientWidth / 2, behavior: instant ? "auto" : "smooth"});
}
function shelfGo(d){
  if(!shelfList.length) return;
  // while a smooth scroll is still moving, step on from where it's heading, not where it is
  const from = Date.now() - shelfAim.t < 700 && shelfAim.i >= 0 ? shelfAim.i : shelfIdx;
  shelfTo(Math.max(0, Math.min(shelfList.length - 1, from + d)));

// Cover-flow: the pack in the middle is big and bright, the ones beside it turn away and shrink.
function shelfLayout(){
  const tr = $("track");
  if(!tr || !shelfList.length) return;
  const mid = tr.scrollLeft + tr.clientWidth / 2;
  let best = 0, bestD = 1e9;
  [...tr.children].forEach((el, i) => {
    const w = el.offsetWidth, d = (el.offsetLeft + w / 2 - mid) / w, a = Math.min(Math.abs(d), 2);
    if(Math.abs(d) < bestD){ bestD = Math.abs(d); best = i; }
    if(Math.abs(d) > 4) return;
    const pk = el.firstChild;
    if(pk.dataset.photo && !pk.style.backgroundImage) pk.style.backgroundImage = "url('" + pk.dataset.photo + "')";
    pk.style.transform = "perspective(1000px) rotateY(" + (-Math.max(-2, Math.min(2, d)) * 24) + "deg) scale(" + (1 - a * .17) + ")";
    pk.style.filter = "brightness(" + (1 - a * .3) + ")";
    el.style.zIndex = 10 - Math.round(a * 3);
  });
  if(best === shelfIdx) return;
  if(shelfIdx >= 0) sfx("tick");
  shelfIdx = best; packFilter.at = shelfList[best].id;
  [...tr.children].forEach((el, i) => el.classList.toggle("on", i === best));
  const s = shelfList[best];
  $("pinfo").innerHTML = '<div class="pname">' + esc(s.name) + '</div>'
    + '<div class="note">' + esc(s.series) + ' · ' + esc(fmtDate(s.date)) + ' · ' + s.total + ' cards in the set</div>'
    + (s.price
      ? '<div class="ppack">Costs <b>' + COIN + ' ' + bux(s.price.p) + ' PokéBux</b> <span class="note">(' + money(s.price.p) + ' on TCGplayer'
          + (s.price.low ? ', cheapest listing' : '') + ')</span></div>'
        + '<button class="btn rip" onclick="openStage(\'' + esc(s.id) + '\')">RIP IT!</button>'
        + (ME ? '<div class="note" style="margin-top:8px">You have ' + bux(ME.bux) + ' PokéBux'
            + (ME.bux < s.price.p ? ' — <a href="#earn">claim more on the Earn page</a>' : '') + '</div>' : '')
      : '<div class="ppack">Sold out — no packs of this set are for sale on TCGplayer right now</div>'
        + '<button class="btn rip" disabled style="opacity:.35;animation:none;cursor:default">SOLD OUT</button>')
    + '<div class="note" style="margin-top:12px">' + (best + 1) + ' of ' + shelfList.length + (matchMedia("(pointer:coarse)").matches ? " · swipe to browse" : " · ← → to browse") + '</div>';
}
function fmtDate(d){
  if(!d) return "";
  const t = new Date(d.replace(/\//g, "-") + "T12:00:00");
  return isNaN(t) ? d : t.toLocaleDateString(undefined, {month: "short", year: "numeric"});
}
// Mouse users can grab the shelf and drag it; the wheel steps one pack at a time.
function shelfDrag(tr){
  let x0 = 0, s0 = 0, down = false;
  tr.onpointerdown = e => { if(e.pointerType !== "mouse") return; down = true; x0 = e.clientX; s0 = tr.scrollLeft; tr.dataset.dragged = "0"; };
  tr.onpointermove = e => {
    if(!down) return;
    const dx = e.clientX - x0;
    if(Math.abs(dx) > 6 && tr.dataset.dragged !== "1"){ tr.dataset.dragged = "1"; tr.classList.add("dragging"); }
    if(tr.dataset.dragged === "1") tr.scrollLeft = s0 - dx;
  };
  const up = () => {
    if(!down) return;
    down = false;
    if(tr.classList.contains("dragging")){ tr.classList.remove("dragging"); shelfTo(shelfIdx); setTimeout(() => tr.dataset.dragged = "0", 60); }
  };
  tr.onpointerup = up; tr.onpointerleave = up;
  tr.onwheel = e => {
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if(Math.abs(d) < 4) return;
    e.preventDefault();
    const now = Date.now();
    if(now - shelfWheel > 170){ shelfWheel = now; shelfGo(Math.sign(d)); }
  };
}

/* ---------------- the opening stage ---------------- */
const TIER_COLOR = {3: "#dfe6ff", 4: "#4da3ff", 5: "#ffc83d", 6: "#ff5fd2", 7: "#c58bff"};
// Face down until you flip it: every pack's last card (its rare slot), plus any other big hit.
// In a god pack, the first good card comes out face UP - no warning glow - and that's the moment the

const godFirst = () => ST.god ? ST.pack.findIndex(c => c.t >= 4) : -1;
const faceDown = i => i !== godFirst() && (ST.pack[i].t >= 4 || i === ST.pack.length - 1);
let pendingOpen = null, ST = null;
function openStage(setId){

  }
  const s = SETMAP[setId];

  if(shelfPack && !ST){

    + '<button class="btn small hide" id="skipBtn" onclick="showSummary()">Skip ›</button>'
    + '<button class="iconbtn" onclick="toggleMute()" id="mute2">' + (MUTED ? "🔇" : "🔊") + '</button>'
    + '<button class="btn small" onclick="closeStage()">✕ Close</button></div>'
    + '<div class="rname" id="rname"></div>'
    + '<div class="arena" id="arena"><div class="rays" id="rays"></div><div class="deck" id="deck"></div>'
    + packArt(s).replace('<div class="crimp t"></div>', '<div class="pbody"></div><div class="flap"><div class="crimp t"></div></div><div class="cut" id="cut"><i></i></div>')
    + '<div class="light" id="light"></div></div>'

// give the pack's picture to its two pieces (strip + body) and take it off the pack itself (see .pbody)
function splitPack(pk){
  const cs = getComputedStyle(pk), body = pk.querySelector(".pbody"), flap = pk.querySelector(".flap");
  [body, flap].forEach(el => { el.style.backgroundImage = cs.backgroundImage; el.style.backgroundColor = cs.backgroundColor; });
  pk.classList.add("split");
  pk.style.backgroundImage = "none";

// The chosen pack's entrance: from its spot on the shelf (or out of a burst of light, when there's no
// shelf behind it) it twirls into the middle (a flat twirl - a Y-spin would show the logo mirrored), lands with a flash, rays in the pack's own
// colour, a shockwave ring and sparks - then floats until you rip it.
function packIntro(from){
  const set = ST, pk = document.querySelector("#arena .pack"), ar = $("arena");
  const hue = hueOf(set.set.id), col = "hsl(" + hue + " 90% 65%)";
  const to = pk.getBoundingClientRect();
  let frames;
  if(from){
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    const k = from.width / to.width;
    frames = [
      {transform: "perspective(900px) translate(" + dx + "px," + dy + "px) scale(" + k + ") rotate(0deg) rotateY(0deg)"},
      {transform: "perspective(900px) translate(" + (dx * .35) + "px," + (dy * .35 - 60) + "px) scale(" + ((k + 1.2) / 2) + ") rotate(200deg) rotateY(25deg)", offset: .45},
      {transform: "perspective(900px) translate(0px,-24px) scale(1.12) rotate(350deg) rotateY(-10deg)", offset: .78},
      {transform: "perspective(900px) translate(0px,0px) scale(1) rotate(360deg) rotateY(0deg)"}
    ];
  } else {
    frames = [
      {transform: "perspective(900px) scale(.05) rotate(-540deg)", opacity: 0},
      {transform: "perspective(900px) scale(1.15) rotate(-20deg)", opacity: 1, offset: .7},
      {transform: "perspective(900px) scale(1) rotate(0deg)", opacity: 1}
    ];
  }
  const dur = from ? 1100 : 950;
  sfx("appear");
  const anim = pk.animate(frames, {duration: dur, easing: "cubic-bezier(.25,.8,.25,1)"});
  anim.onfinish = () => {
    if(ST !== set || ST.phase !== "pack") return;  // already being ripped: no landing show, no float
    // the landing: flash, rays, ring, sparks, thud + shing
    const rays = $("rays");
    rays.style.setProperty("--rc", col);
    rays.className = "rays on boom";
    setTimeout(() => { if(ST === set && ST.phase === "pack") rays.className = "rays on"; }, 900);
    const ring = document.createElement("div"); ring.className = "ring"; ring.style.setProperty("--rc", col);
    ar.appendChild(ring); setTimeout(() => ring.remove(), 950);
    const f = document.createElement("div"); f.className = "flash"; $("stage").appendChild(f); setTimeout(() => f.remove(), 850);
    const r = pk.getBoundingClientRect();
    emit(r.left + r.width / 2, r.top + r.height / 2, 70, [col, "#fff", "hsl(" + ((hue + 40) % 360) + " 90% 70%)"], "spark", 1.3);
    sfx("thud"); sfx("land-chime");
    pk.classList.add("idle");
    ST.busy = false;
  };
}
function stopRiser(){ if(ST && ST.riser){ ST.riser(); ST.riser = null; } }
function hideStage(){

  FX.p = []; FX.x = null;

}
function closeStage(){ hideStage(); route(); }
document.addEventListener("keydown", e => {
  if(ST){
    if(e.key === "Escape") return closeStage();
    if(e.key === " " || e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowLeft"){
      if(e.target.closest && e.target.closest("button") && ST.phase === "done") return;
      e.preventDefault(); stageKey(e.key === "ArrowRight" ? 1 : -1);
    }
    else if(e.key.toLowerCase() === "s") showSummary();
    return;
  }
  if(!$("modal").classList.contains("hide")){ if(e.key === "Escape") closeModal(); return; }
  if(!$("track") || (e.target.matches && e.target.matches("input"))) return;
  if(e.key === "ArrowLeft"){ e.preventDefault(); shelfGo(-1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); shelfGo(1); }

});
function stageKey(dir){
  if(!ST || ST.busy) return;
  if(ST.phase === "pack") return autoTear();
  if(ST.phase === "cards") return ST.flipped ? toss(dir) : flipCard();
}

// the pack / top card leans toward the pointer, and its shine follows it
function tilt(e){
  const ar = $("arena");
  if(!ar) return;
  if(!e){ ar.style.setProperty("--rx", "0deg"); ar.style.setProperty("--ry", "0deg"); return; }
  const r = ar.getBoundingClientRect();
  const px = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), py = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  ar.style.setProperty("--rx", ((.5 - py) * 10).toFixed(1) + "deg");
  ar.style.setProperty("--ry", ((px - .5) * 14).toFixed(1) + "deg");
  ar.style.setProperty("--gx", (px * 100).toFixed(0) + "%");
  ar.style.setProperty("--gy", (py * 100).toFixed(0) + "%");
}

function pDown(e){
  if(!ST || ST.busy || e.button > 0) return;
  if(ST.phase === "pack"){
    if(ST.autoing) return;

    $("arena").setPointerCapture(e.pointerId);

const FX = {p: [], on: false, x: null, dpr: 1};
function fxSize(){
  const c = $("fx");

  FX.dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * FX.dpr; c.height = innerHeight * FX.dpr;

}
window.addEventListener("resize", () => { if(ST) fxSize(); });
function emit(x, y, n, colors, kind, power){
  if(!FX.x) return;
  power = power || 1;
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, conf = kind === "confetti";
    const v = (conf ? 3 + Math.random() * 8 : 2 + Math.random() * 9) * power;
    FX.p.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (conf ? 6 : 1.5), life: 1,
      decay: conf ? .005 + Math.random() * .005 : .02 + Math.random() * .025, col: colors[i % colors.length], kind,
      s: conf ? 6 + Math.random() * 6 : 1.5 + Math.random() * 2.5, r: Math.random() * 6, vr: (Math.random() - .5) * .35});
  }
  if(FX.p.length > 900) FX.p.splice(0, FX.p.length - 900);
  if(!FX.on){ FX.on = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const x = FX.x;
  if(!x){ FX.p = []; FX.on = false; return; }
  x.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
  x.clearRect(0, 0, innerWidth, innerHeight);
  FX.p = FX.p.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for(const p of FX.p){
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if(p.kind === "confetti"){
      p.vy += .16; p.vx *= .985; p.vy *= .985; p.r += p.vr;
      x.save(); x.globalAlpha = Math.min(1, p.life * 2); x.translate(p.x, p.y); x.rotate(p.r);
      x.fillStyle = p.col; x.fillRect(-p.s / 2, -p.s / 4, p.s, Math.max(1, p.s / 2 * Math.abs(Math.cos(p.r * 2))));
      x.restore();
    } else {
      p.vy += .1; p.vx *= .955; p.vy *= .955;
      x.globalAlpha = Math.max(0, p.life);
      x.strokeStyle = p.col; x.lineWidth = p.s; x.lineCap = "round";
      x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); x.stroke();
    }
  }
  x.globalAlpha = 1;
  if(FX.p.length) requestAnimationFrame(fxLoop);
  else { FX.on = false; x.clearRect(0, 0, innerWidth, innerHeight); }
}

let AC = null, OUT = null, VERB = null, NOISE = null;
function toggleMute(){
  MUTED = !MUTED; store("prMute", MUTED ? "1" : "0");
  $("mute").textContent = MUTED ? "🔇" : "🔊";
  if($("mute2")) $("mute2").textContent = MUTED ? "🔇" : "🔊";
  if(MUTED) stopRiser();

function audio(){
  if(MUTED) return null;

      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
      OUT = AC.createGain(); OUT.gain.value = .9; OUT.connect(comp).connect(AC.destination);

      VERB.buffer = ir;
      const vg = AC.createGain(); vg.gain.value = .5; VERB.connect(vg).connect(OUT);
      NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NOISE.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}

}

  switch(kind){
    case "crinkle":   // foil crackling as the pack tears
      for(let i = 0; i < 3; i++) nz(t + R() * .03, .02 + R() * .04, {f: 2200 + R() * 5000, q: 2.5, g: .06 + .22 * (arg || .5)});
      break;
    case "rip":
      nz(t, .4, {f: 900, f2: 7000, q: .8, g: .8});
      nz(t + .03, .3, {type: "highpass", f: 3500, g: .3});
      osc(t, 170, .3, {hz2: 45, g: .55});
      for(let i = 0; i < 6; i++) nz(t + .1 + R() * .25, .03, {f: 3000 + R() * 4000, q: 3, g: .12});
      break;
    case "thud":      // the pack landing
      osc(t, 120, .35, {hz2: 40, g: .7});
      nz(t, .12, {type: "lowpass", f: 900, g: .35});
      for(let i = 0; i < 4; i++) nz(t + .04 + R() * .15, .03, {f: 3000 + R() * 3000, q: 2, g: .08});
      break;
    case "whoosh": nz(t, .32, {f: 450, f2: 2800, q: .7, g: .4, a: .09}); break;
    case "flip": nz(t, .05, {type: "highpass", f: 2400, g: .4}); osc(t, 1300, .05, {g: .05, type: "triangle"}); break;
    case "land": nz(t, .07, {type: "lowpass", f: 1400, g: .45}); osc(t, 95, .16, {hz2: 50, g: .35}); break;
    case "deal": nz(t, .06, {f: 1800 + R() * 800, q: 1.5, g: .18}); break;
    case "tick": osc(t, 1500 + R() * 400, .03, {type: "square", g: .03}); break;
    case "appear":    // a rising whoosh as the pack flies in
      nz(t, .9, {f: 250, f2: 4200, q: 1.2, g: .32, a: .5});
      osc(t, 180, .9, {hz2: 520, type: "triangle", g: .05, a: .6});
      break;
    case "land-chime": // the "shing" as it lands
      [1318.5, 1760, 2637].forEach((hz, i) => osc(t + i * .06, hz, 1.1, {type: "triangle", g: .08, verb: true}));
      nz(t, .6, {type: "highpass", f: 7000, g: .08, verb: true});
      break;
    case "godpack":   // a fanfare on top of the big reveal
      [523.3, 659.3, 784, 1046.5, 784, 1046.5, 1318.5, 1568].forEach((hz, i) => osc(t + .2 + i * .11, hz, i === 7 ? 1.8 : .35, {type: "triangle", g: .09, verb: true}));
      [2093, 2637, 3136, 4186].forEach((hz, i) => osc(t + 1.2 + i * .08, hz, .9, {g: .05, verb: true}));
      break;
    case "ding": osc(t, 1318.5, .9, {type: "triangle", g: .12, verb: true}); osc(t + .08, 1975.5, .9, {g: .07, verb: true}); break;
    case "riser": {   // the build-up while a rare card waits face down; returns a stop function
      const dur = 3.2, nodes = [];
      const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
      const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3;
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5500, t + dur);
      const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + dur);
      const o = AC.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(arg >= 6 ? 420 : 320, t + dur);
      const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
      const og = AC.createGain(); og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(.08, t + dur);
      s.connect(f).connect(g).connect(OUT); o.connect(lp).connect(og).connect(OUT);
      s.start(t); o.start(t);
      for(let k = 0; k < 7; k++) nodes.push(osc(t + k * .45, 70, .2, {hz2: 42, g: .25 + k * .06}));   // heartbeat
      return () => {
        const n = AC.currentTime;
        [g, og].forEach(x => { x.gain.cancelScheduledValues(n); x.gain.setValueAtTime(Math.max(.0001, x.gain.value), n); x.gain.exponentialRampToValueAtTime(.0001, n + .08); });
        try{ s.stop(n + .1); o.stop(n + .1); nodes.forEach(x => x.stop(n)); }catch(e){}
      };
    }
    case "reveal": {  // BOOM + a chord that gets bigger the rarer the card
      const tier = arg || 4;
      if(tier >= 5){ osc(t, 95, 1.1, {hz2: 30, g: .95}); nz(t, .6, {type: "lowpass", f: 2500, f2: 150, g: .55}); }
      else osc(t, 130, .4, {hz2: 60, g: .5});
      nz(t, 1.3, {type: "highpass", f: 6500, g: .1, a: .02, verb: true});
      const ch = CHORDS[tier] || CHORDS[4], len = tier >= 5 ? 2.6 : 1.3;
      ch.forEach((hz, i) => {
        osc(t + i * .035, hz, len, {type: "triangle", g: .085, verb: true});
        osc(t + i * .035, hz * 2, len * .8, {g: .03, det: 8, verb: true});
      });
      if(tier >= 6) [2093, 2637, 3136, 4186, 3136, 4186, 5274].forEach((hz, i) => osc(t + .15 + i * .07, hz, .5, {g: .05, verb: true}));
      if(tier >= 7) [1046.5, 1318.5, 1568, 2093, 2637].forEach((hz, i) => osc(t + .75 + i * .11, hz, 1.8, {type: "triangle", g: .07, verb: true}));
      break;
    }
  }
  return () => {};
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- pictures ----------------
   The newest sets' pictures are on images.scrydex.com, which blocks sites that ask too often, so
   those go through the Pack Rip server (/img/...), which saves each one the first time. If a
   picture still won't load, a placeholder with the card's name shows while it keeps retrying. */
const SCRYDEX = "https://images.scrydex.com/";
function pic(u){ return u && u.startsWith(SCRYDEX) && SERVER ? SERVER + "/img/" + u.slice(SCRYDEX.length) : (u || ""); }
function placeholder(name){
  const x = String(name || "").replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch]));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 342">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f6b"/><stop offset="1" stop-color="#171a2e"/></linearGradient></defs>'
    + '<rect x="4" y="4" width="237" height="334" rx="12" fill="url(#g)" stroke="#f1c232" stroke-width="8"/>'
    + '<circle cx="122" cy="140" r="44" fill="none" stroke="#ffffff38" stroke-width="8"/><path d="M78 140h88" stroke="#ffffff38" stroke-width="8"/>'
    + '<circle cx="122" cy="140" r="13" fill="#171a2e" stroke="#ffffff38" stroke-width="6"/>'
    + '<text x="122" y="240" font-family="Segoe UI,sans-serif" font-size="' + (x.length > 16 ? 14 : 19) + '" font-weight="700" fill="#fff" text-anchor="middle">' + x + '</text>'
    + '<text x="122" y="268" font-family="Segoe UI,sans-serif" font-size="12" fill="#9aa0c7" text-anchor="middle">picture loading…</text></svg>';
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
// Any picture that fails: show the placeholder (or, for a set logo, the set's name), then keep
// trying the real picture in the background and swap it in the moment it works.
document.addEventListener("error", e => {
  const img = e.target;
  if(!(img instanceof HTMLImageElement) || img.dataset.real || img.src.startsWith("data:")) return;
  const real = img.src;
  img.dataset.real = real;
  if(img.classList.contains("lg")){
    img.style.visibility = "hidden";
    const n = document.createElement("div"); n.className = "sn"; n.textContent = img.alt;
    img.after(n);
  } else img.src = placeholder(img.alt);
  let n = 0;
  const retry = () => {
    if(!img.isConnected || n >= 8) return;
    const t = new Image();
    t.onload = () => {
      img.src = t.src; img.style.visibility = "";
      if(img.nextElementSibling && img.nextElementSibling.classList.contains("sn") && img.classList.contains("lg")) img.nextElementSibling.remove();
    };
    t.onerror = () => { n++; setTimeout(retry, Math.min(60000, 3000 * n * n)); };
    t.src = real + (real.includes("?") ? "&" : "?") + "r=" + n;
  };
  setTimeout(retry, 2500);
}, true);

/* ---------------- card tiles + zoom ---------------- */
function cardTile(c, o){
  o = o || {};
  const cls = "card" + (c.t >= 4 ? " t" + c.t : "") + (o.miss ? " miss" : "");
  return '<button class="' + cls + '" onclick="zoomCard(\'' + esc(c.id) + '\',' + (o.qty || 0) + ',' + (c.rh ? 1 : 0) + ',\'' + esc(c.rv || "") + '\')">'
    + '<img src="' + esc(pic(o.big ? (c.l || c.s) : c.s)) + '" alt="' + esc(c.n) + '"' + (o.big ? '' : ' loading="lazy"') + '>'
    + (o.showNew && c.new ? '<span class="newb">NEW</span>' : '')
    + (o.qty > 1 ? '<span class="qty">×' + o.qty + '</span>' : '')
    + '<div class="cap"><span>' + esc(o.label || c.n) + '</span>' + priceHTML(c) + '</div></button>';
}
function zoomCard(id, qty, rh, rv, grade){
  const c = cardIndex[id] || (ST && ST.pack && ST.pack.find(x => x.id === id));
  if(!c) return;
  const s = SETMAP[setOf(id)];
  const shown = Object.assign({}, c, {rh: rh ? 1 : 0, rv: rv || ""});
  $("modal").innerHTML = '<div class="zoom"><img src="' + esc(pic(c.l || c.s)) + '" alt="' + esc(c.n) + '">'
    + '<div class="meta"><b>' + esc(c.n) + '</b><br>' + esc(c.r || "") + rhName(shown) + ' · ' + esc(s ? s.name : "") + ' #' + esc(c.num)
    + (grade ? '<br><b style="color:#ff8a9c">PSA ' + grade + '</b> · worth ' + slabPriceHTML(c, grade) + ' <span class="note">(raw ' + money(c.p || 0)
        + ')</span><br><span class="note" style="display:inline-block;max-width:340px">' + esc(EST_WHY.grade) + '</span>'
      : '<br>' + priceHTML(c) + (c.p == null ? '' : c.e ? ' <span class="note">estimate</span><br><span class="note" style="display:inline-block;max-width:340px">'
        + esc(EST_WHY[c.e].replace("{r}", c.r || "similar")) + '</span>' : ' <span class="note">market price (TCGplayer)</span>'))
    + (qty ? '<br>Owned: ' + qty : '') + '</div></div>';
  $("modal").classList.remove("hide");
  $("modal").querySelector(".zoom").onclick = closeModal;
}

/* ---------------- collections (yours, or a friend's) ---------------- */
async function getPlayer(name){
  if(!name){ if(!ME) return null; ME = await api("/me"); return ME; }
  return api("/player/" + encodeURIComponent(name));
}
const setsBase = name => name ? "#player/" + encodeURIComponent(name) + "/set/" : "#set/";
async function showCollection(name){
  const m = $("main");
  if(!name && !ME){ m.innerHTML = offlineBanner() + '<h1>My collection</h1>' + needSignIn("start your collection"); return; }
  m.innerHTML = offlineBanner() + '<div class="spin"></div>';
  let p;
  try{ p = await getPlayer(name); await loadSetsFor(Object.keys(p.cards).concat((p.slabs || []).map(x => x.id))); }
  catch(e){ m.innerHTML = offlineBanner() + '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const mine = !name || (ME && name.toLowerCase() === ME.name.toLowerCase());
  const ids = Object.keys(p.cards);
  const copies = ids.reduce((a, id) => a + p.cards[id], 0);
  const value = ids.reduce((a, id) => a + ((cardIndex[id] || {}).p || 0) * p.cards[id], 0)
    + (p.slabs || []).reduce((a, x) => a + slabValue(cardIndex[x.id], x.grade), 0);
  const guessed = ids.some(id => (cardIndex[id] || {}).e) || (p.slabs || []).length > 0;
  const perSet = {};
  ids.forEach(id => { const s = packSetOf(id); perSet[s] = (perSet[s] || 0) + 1; });
  const setList = Object.keys(perSet).filter(s => SETMAP[s] && SETMAP[s].pack).sort((a, b) => (SETMAP[b].date || "").localeCompare(SETMAP[a].date || ""));
  const top = ids.map(id => cardIndex[id]).filter(Boolean).sort((a, b) => (b.t - a.t) || ((b.p || 0) - (a.p || 0))).slice(0, 12);
  const friend = !mine && ME && ME.friends.some(f => f.toLowerCase() === p.name.toLowerCase());
  m.innerHTML = offlineBanner()
    + (mine ? '' : '<button class="back" onclick="location.hash=\'#friends\'">‹ Friends</button>')
    + '<div class="head"><h1>' + (mine ? "My collection" : esc(p.name) + "'s collection") + '</h1>'
    + (!mine && ME ? '<button class="btn small" onclick="friendToggle(\'' + esc(p.name) + '\',' + !friend + ')">' + (friend ? "Remove friend" : "+ Add friend") + '</button>' : '')
    + '</div>'
    + '<div class="stats">'
    + stat(ids.length.toLocaleString(), "different cards") + stat(copies.toLocaleString(), "cards in total")
    + stat(p.packs.toLocaleString(), "packs opened") + stat((guessed ? "~" : "") + money(value), guessed ? "collection value (some estimated)" : "collection value") + '</div>'
    + (ids.length ? '' : '<div class="empty">' + (mine ? 'No cards yet. <a href="#open">Rip your first pack!</a>' : "No cards yet.") + '</div>')
    + ((p.slabs || []).length ? '<h2>Graded by PSA</h2><div class="slabs">' + p.slabs.map(x => cardIndex[x.id]
        ? '<div>' + slabHTML(cardIndex[x.id], x.grade, "", ' onclick="zoomCard(\'' + esc(x.id) + '\',0,0,\'\',' + x.grade + ')" style="cursor:zoom-in"') + '<div class="slabcap"><span>PSA ' + x.grade + '</span>' + slabPriceHTML(cardIndex[x.id], x.grade) + '</div></div>' : '').join("") + '</div>' : '')
    + (top.length ? '<h2>Best pulls</h2><div class="cards">' + top.map(c => cardTile(c, {qty: p.cards[c.id]})).join("") + '</div>' : '')
    + (setList.length ? '<h2>Sets</h2><div class="setrows">' + setList.map(sid => {
        const s = SETMAP[sid], have = perSet[sid];
        const total = ((SETCARDS[sid] || []).length || s.total) + (BONUS[sid] ? (SETCARDS[BONUS[sid]] || []).length || (SETMAP[BONUS[sid]] || {}).total || 0 : 0);
        return '<button class="setrow" onclick="location.hash=\'' + setsBase(name) + esc(sid) + '\'">'
          + '<img src="' + esc(pic(s.logo)) + '" alt="" loading="lazy"><div class="info"><div class="nm">' + esc(s.name) + '</div>'
          + '<div class="note">' + have + ' / ' + total + ' cards</div><div class="prog"><i style="width:' + Math.min(100, have / total * 100) + '%"></i></div></div></button>';
      }).join("") + '</div>' : '');
}
const stat = (v, k) => '<div class="stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';

let binderShow = "all";
async function showBinder(name, sid){
  const m = $("main");
  if(!name && !ME){ m.innerHTML = needSignIn("see your collection"); return; }
  // a bonus mini-set opens its main set's binder, which includes the bonus cards
  if(PARENT[sid]){ location.replace((name ? "#player/" + encodeURIComponent(name) + "/set/" : "#set/") + PARENT[sid]); return; }
  const s = SETMAP[sid];
  if(!s){ m.innerHTML = '<div class="empty">That set wasn\'t found.</div>'; return; }
  m.innerHTML = '<div class="spin"></div>';
  let p, cards;
  try{
    let more;
    [p, cards, more] = await Promise.all([getPlayer(name), setCards(sid), BONUS[sid] ? setCards(BONUS[sid]).catch(() => []) : []]);
    cards = cards.concat(more);
  }
  catch(e){ m.innerHTML = offlineBanner() + '<div class="empty">' + esc(e.message) + '</div>'; return; }
  cards.forEach(c => cardIndex[c.id] = c);
  // graded copies count too: best grade per card, and their graded value
  const slabsOf = {};
  (p.slabs || []).forEach(x => (slabsOf[x.id] = slabsOf[x.id] || []).push(x.grade));
  const owns = c => !!(p.cards[c.id] || slabsOf[c.id]);
  const have = cards.filter(owns);
  const val = have.reduce((a, c) => a + (c.p || 0) * (p.cards[c.id] || 0)
    + (slabsOf[c.id] || []).reduce((b, g) => b + slabValue(c, g), 0), 0);
  const back = name ? "#player/" + encodeURIComponent(name) : "#collection";
  m.innerHTML = '<button class="back" onclick="location.hash=\'' + back + '\'">‹ ' + (name ? esc(p.name) + "'s collection" : "My collection") + '</button>'
    + '<div class="head"><img class="lgbig" src="' + esc(pic(s.logo)) + '" alt=""><div><h1>' + esc(s.name) + '</h1>'
    + '<div class="note">' + have.length + ' of ' + cards.length + ' cards · worth ' + (have.some(c => c.e || slabsOf[c.id]) ? "~" : "") + money(val) + '</div></div>'
    + ((!name || (ME && p.name === ME.name)) && s.pack ? '<button class="btn main" style="margin-left:auto" onclick="openStage(\'' + esc(sid) + '\')">Rip a pack</button>' : '')
    + '</div><div class="prog" style="margin:14px 0 16px"><i style="width:' + (have.length / cards.length * 100) + '%"></i></div>'
    + '<div class="chips">' + [["all","All"],["have","Have"],["miss","Missing"]].map(([k, l]) => '<button class="chip' + (binderShow === k ? " on" : "") + '" data-k="' + k + '">' + l + '</button>').join("") + '</div>'
    + '<div class="cards" id="bgrid"></div>';
  const draw = () => {
    const list = cards.filter(c => binderShow === "all" || (binderShow === "have") === owns(c));
    $("bgrid").innerHTML = list.map(c => {
      const gs = slabsOf[c.id];
      if(!gs || p.cards[c.id]) return cardTile(c, {qty: p.cards[c.id] || 0, miss: !owns(c), label: "#" + c.num + " " + c.n})
        .replace('</button>', gs ? '<span class="psabadge">PSA ' + Math.max(...gs) + '</span></button>' : '</button>');
      // only graded copies: show the best one's grade and graded value
      const g = Math.max(...gs);
      return '<button class="card" onclick="zoomCard(\'' + esc(c.id) + '\',0,0,\'\',' + g + ')">'
        + '<img src="' + esc(pic(c.s)) + '" alt="' + esc(c.n) + '" loading="lazy"><span class="psabadge">PSA ' + g + '</span>'
        + (gs.length > 1 ? '<span class="qty">×' + gs.length + '</span>' : '')
        + '<div class="cap"><span>#' + esc(c.num) + ' ' + esc(c.n) + '</span>' + slabPriceHTML(c, g) + '</div></button>';
    }).join("")
      || '<div class="empty" style="grid-column:1/-1">Nothing here.</div>';
  };
  m.querySelectorAll(".chip").forEach(b => b.onclick = () => { binderShow = b.dataset.k; m.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  draw();
}

/* ---------------- big pulls feed ---------------- */
async function showPulls(){
  const m = $("main");
  m.innerHTML = offlineBanner() + '<h1>Big pulls</h1><p class="sub">The best cards anyone on Pack Rip has pulled lately.</p><div class="spin"></div>';
  let feed;
  try{ feed = (await api("/feed")).feed; }
  catch(e){ m.innerHTML = offlineBanner() + '<h1>Big pulls</h1><div class="empty">' + esc(e.message) + '</div>'; return; }
  // today's TCGplayer price, not the one saved when it was pulled
  try{ await loadSetsFor(feed.map(f => f.card.id)); }catch(e){}
  feed.forEach(f => {
    const now = cardIndex[f.card.id];
    if(now){ f.card = Object.assign({}, f.card, {p: now.p, e: now.e}); delete f.card.rh; }
    else cardIndex[f.card.id] = Object.assign({num: f.card.id.split("-").pop()}, f.card);
  });
  m.querySelector(".spin").outerHTML = feed.length ? '<div class="cards feed">' + feed.map(f => '<div>' + cardTile(f.card)
    + '<div class="who"><a href="#player/' + encodeURIComponent(f.who) + '">' + esc(f.who) + '</a> pulled it from ' + (f.g ? '<b class="godtag" style="font-size:13px">a ' + (f.g === "god" ? "GOD PACK" : "demi-god pack") + '</b> of ' : '') + esc(f.set) + ' · ' + ago(f.at) + '</div></div>').join("") + '</div>'
    : '<div class="empty">No big pulls yet. Go rip some packs!</div>';
}

function earnNow(){

function hm(sec){

/* ---------------- wheels ----------------
   Archer asked for "a wheel you can spin out of every pokemon" and one with 10, 5, 25, 30, 15, 20.
   A canvas wheel: slices are drawn once to an off-screen canvas, then rotated each frame. The
   Pokemon list (all 1,025) and artwork come from PokeAPI; the list is remembered in localStorage. */
const NUMS = [10, 5, 25, 30, 15, 20];
const NUM_COLORS = ["#ff5f5f", "#ffb84d", "#5fd38a", "#4da3ff", "#b388ff", "#ff5fd2"];
let MONS = null;
const WHEELS = {};
const MON_NAMES = {"nidoran-f": "Nidoran♀", "nidoran-m": "Nidoran♂", "mr-mime": "Mr. Mime", "mime-jr": "Mime Jr.",
  "mr-rime": "Mr. Rime", "ho-oh": "Ho-Oh", "porygon-z": "Porygon-Z", "type-null": "Type: Null", "jangmo-o": "Jangmo-o",
  "hakamo-o": "Hakamo-o", "kommo-o": "Kommo-o", "farfetchd": "Farfetch'd", "sirfetchd": "Sirfetch'd", "flabebe": "Flabébé",
  "tapu-koko": "Tapu Koko", "tapu-lele": "Tapu Lele", "tapu-bulu": "Tapu Bulu", "tapu-fini": "Tapu Fini", "wo-chien": "Wo-Chien",
  "chien-pao": "Chien-Pao", "ting-lu": "Ting-Lu", "chi-yu": "Chi-Yu"};
const monName = n => MON_NAMES[n] || n.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const artwork = id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png";

async function loadMons(){
  if(MONS) return MONS;
  try{ const saved = JSON.parse(store("prMons") || "null"); if(saved && saved.length >= 1025){ MONS = saved; return MONS; } }catch(e){}
  const r = await fetch("https://pokeapi.co/api/v2/pokemon-species?limit=2000");
  const d = await r.json();

function makeWheel(key, slices){
  const cv = $("wc-" + key), size = 800;
  cv.width = size; cv.height = size;
  // the slices, drawn once; slice i is centred at angle i*a from the top, clockwise
  const off = document.createElement("canvas"); off.width = size; off.height = size;
  const x = off.getContext("2d"), n = slices.length, a = Math.PI * 2 / n, R = size / 2;
  x.translate(R, R);
  slices.forEach((sl, i) => {
    const mid = -Math.PI / 2 + i * a;
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, mid - a / 2, mid + a / 2); x.closePath();
    x.fillStyle = sl.color; x.fill();
    if(n <= 40){
      x.strokeStyle = "#0006"; x.lineWidth = 3; x.stroke();
      x.save(); x.rotate(mid); x.fillStyle = "#fff"; x.font = "900 " + (n <= 8 ? 72 : 34) + "px system-ui,sans-serif";
      x.textAlign = "right"; x.textBaseline = "middle"; x.shadowColor = "#0009"; x.shadowBlur = 8;
      x.fillText(sl.label, R - 36, 0); x.restore();
    }
  });
  if(n > 40){
    // too many slices to label: rings for depth instead
    const g = x.createRadialGradient(0, 0, R * .1, 0, 0, R);
    g.addColorStop(0, "#ffffff55"); g.addColorStop(.6, "#ffffff00"); g.addColorStop(1, "#00000055");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.fill();
  }
  WHEELS[key] = {cv, off, slices, rot: 0, spinning: false};
  drawWheel(key);
}
function drawWheel(key){
  const w = WHEELS[key], x = w.cv.getContext("2d"), S = w.cv.width;
  x.clearRect(0, 0, S, S);
  x.save(); x.translate(S / 2, S / 2); x.rotate(w.rot); x.drawImage(w.off, -S / 2, -S / 2); x.restore();
}
function wheelIndex(w){
  const n = w.slices.length, a = Math.PI * 2 / n;
  const r = ((-w.rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  return Math.round(r / a) % n;
}
function spinWheel(key){
  const w = WHEELS[key];
  if(!w || w.spinning) return;
  const n = w.slices.length, a = Math.PI * 2 / n, pick = Math.floor(Math.random() * n);
  // land slice `pick` under the pointer, anywhere inside it, after 6-8 full turns
  const want = -(pick * a) + (Math.random() - .5) * a * .7;
  const now = ((w.rot % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let delta = ((want - now) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  delta += Math.PI * 2 * (6 + Math.floor(Math.random() * 3));
  const start = w.rot, t0 = performance.now(), dur = 5200 + Math.random() * 1200;
  w.spinning = true; $("wb-" + key).disabled = true; $("wr-" + key).innerHTML = "";
  let last = wheelIndex(w), lastTick = 0;
  const step = now2 => {
    if(!$("wc-" + key)){ w.spinning = false; return; }
    const k = Math.min(1, (now2 - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    w.rot = start + delta * e;
    drawWheel(key);
    const i = wheelIndex(w);
    if(i !== last){
      last = i;
      if(key === "mon") $("wnow-mon").textContent = "#" + (i + 1) + " " + w.slices[i].label;
      if(now2 - lastTick > 45){ lastTick = now2; sfx("tick"); }
    }
    if(k < 1) return requestAnimationFrame(step);
    w.spinning = false; $("wb-" + key).disabled = false;
    wheelDone(key, wheelIndex(w));
  };
  requestAnimationFrame(step);
}
function wheelDone(key, i){
  const w = WHEELS[key], r = $("wr-" + key);
  if(key === "mon"){
    $("wnow-mon").textContent = "";
    r.innerHTML = '<div class="pop"><img src="' + artwork(i + 1) + '" alt="' + esc(w.slices[i].label) + '">'
      + '<div class="wn">' + esc(w.slices[i].label) + '</div><div class="wno">#' + String(i + 1).padStart(4, "0") + '</div></div>'
      + '<div class="wpacks" id="wpacks"><div class="note">Finding every pack with ' + esc(w.slices[i].label) + '…</div></div>';
    sfx("reveal", 5);
    showMonPacks(w.slices[i].label);
  } else {
    r.innerHTML = '<div class="pop"><div class="wbig">' + esc(w.slices[i].label) + '</div></div>';
    sfx("ding");
  }
}

/* ---------------- PSA grading ----------------
   Send a card for 20 PokeBux; it comes back in a PSA slab after GRADE_SECONDS (10 minutes live, 1
   second on the test server). The server rolls and keeps the grade secret until it's back. */
let PSA = null, PSA_TIMER = 0, PSA_SKEW = 0, PSA_ON = false;
// A graded copy's value: TCGplayer's raw price x how graded cards of that grade usually sell, with a
// floor (no free source has graded prices, so it's always an estimate). Same table as the server's.
const GRADE_VALUE = {10: [4, 15], 9.5: [2.5, 10], 9: [1.5, 6], 8: [1, 4], 7: [.8, 0], 6: [.65, 0], 5: [.5, 0],
  4: [.4, 0], 3: [.3, 0], 2: [.25, 0], 1: [.2, 0]};
function slabValue(c, grade){
  const [times, floor] = GRADE_VALUE[grade] || [1, 0];
  return Math.round(Math.max(((c && c.p) || 0) * times, floor) * 100) / 100;
}
const slabPriceHTML = (c, grade) => '<span class="price est" title="Estimated: a PSA ' + grade + ' usually sells for about '
  + (GRADE_VALUE[grade] || [1])[0] + '× the raw card (raw: ' + money((c && c.p) || 0) + ' on TCGplayer)">~' + money(slabValue(c, grade)) + '</span>';
const EST_GRADE = "Estimated from the grade: TCGplayer doesn't list graded prices, so it's the raw card's price times what that PSA grade usually sells for.";
function slabHTML(c, grade, label, extra){
  const st = SETMAP[setOf(c.id)] || {};
  return '<div class="slab' + (grade === 10 ? " g10" : "") + '"' + (extra || "") + '><div class="lab"><div class="ln"><b>' + esc(c.n || "") + '</b>'
    + esc(st.name || "") + (c.num ? ' #' + esc(c.num) : '') + '<br><span class="psa">PSA</span></div>'
    + '<div class="lg">' + esc(label || "") + '<span class="gn">' + grade + '</span></div></div>'
    + '<img src="' + esc(pic(c.l || c.s || "")) + '" alt="' + esc(c.n || "") + '" loading="lazy"></div>';
}
const secsText = n => n >= 60 ? Math.round(n / 60) + " minutes" : n + (n === 1 ? " second" : " seconds");
async function showPSA(){
  const m = $("main");
  if(!ME){ m.innerHTML = '<div class="psa"><div class="psahead"><h1><span class="psalogo">PSA</span>Grading</h1></div>' + needSignIn("send cards to PSA") + '</div>'; return; }
  m.innerHTML = '<div class="spin"></div>';

    PSA = await api("/psa"); PSA_SKEW = Date.now() / 1000 - PSA.now;

  drawPSA();
  if(PSA.back.length) psaReveal(PSA.slabs.filter(x => PSA.back.includes(x.sid)));
}
function drawPSA(){
  const m = $("main");
